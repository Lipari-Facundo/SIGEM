spring.application.name=backend
sigem.jwt.secret-base64=${SIGEM_JWT_SECRET_BASE64}
spring.datasource.url=${SIGEM_DB_URL}
spring.datasource.username=${SIGEM_DB_USERNAME}
spring.datasource.password=${SIGEM_DB_PASSWORD}
spring.datasource.driver-class-name=${SIGEM_DB_DRIVER:org.postgresql.Driver}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.flyway.enabled=false
server.port=8081
spring.main.allow-circular-references=true
